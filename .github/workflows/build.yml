name: Compilar JobsSkees

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar
        run: mvn -B package

      - name: Guardar el .jar
        uses: actions/upload-artifact@v4
        with:
          name: JobsSkees-jar
          path: target/JobsSkees-*.jar
