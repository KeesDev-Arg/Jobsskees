# Arbol de talentos: MINERO (Miner)
# Cada nivel del trabajo en Jobs da 1 punto (ver points-per-level en config.yml).
# Este arbol cuesta 200 puntos en total: se completa al nivel 200.

job: Miner                       # nombre del trabajo en Jobs (se usa en el placeholder de nivel)
display: "&bMinero"
icon: DIAMOND_PICKAXE
description:
  - "&7Mejoras pequenas para el minero."
  - "&7Se suman con tu pico, no lo reemplazan."

# Grupos de bloques reutilizables en los efectos con la sintaxis @nombre
groups:
  ores:
    - COAL_ORE
    - DEEPSLATE_COAL_ORE
    - COPPER_ORE
    - DEEPSLATE_COPPER_ORE
    - IRON_ORE
    - DEEPSLATE_IRON_ORE
    - GOLD_ORE
    - DEEPSLATE_GOLD_ORE
    - NETHER_GOLD_ORE
    - REDSTONE_ORE
    - DEEPSLATE_REDSTONE_ORE
    - LAPIS_ORE
    - DEEPSLATE_LAPIS_ORE
    - DIAMOND_ORE
    - DEEPSLATE_DIAMOND_ORE
    - EMERALD_ORE
    - DEEPSLATE_EMERALD_ORE
    - NETHER_QUARTZ_ORE

# Tipos de efecto: drop_bonus | durability_save | attribute | commands
# row: fila 0-4 | col: columna 0-8 | cost: puntos | requires: ids de nodos previos
